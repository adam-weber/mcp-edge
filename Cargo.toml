[package]
name = "mcp-edge"
version = "0.1.0"
edition = "2021"
description = "Minimal MCP runtime for resource-constrained devices"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []
gateway = ["std"]
# `tls` reserves the `tls://` URL scheme in MultiConnector. The actual rustls
# integration lands in a follow-up PR; today the surface compiles but the
# tls:// arm returns "tls connector not yet implemented".
tls = ["std"]
# `udp` enables the `udp://` URL scheme: UdpConnector for the gateway and
# UdpTransport for leaves/servers. Datagram-framed; one request, one reply.
udp = ["std"]

[dependencies]

[lib]
name = "mcp_edge"
path = "src/lib.rs"

[[example]]
name = "sensor"
required-features = ["std"]

[[example]]
name = "stdio"
required-features = ["std"]

[[example]]
name = "wrap"
required-features = ["std"]

[[example]]
name = "gateway"
required-features = ["gateway"]

[[example]]
name = "bench"
required-features = ["gateway"]

# A "benchmarks" profile that swaps `opt-level = "z"` (size) for `opt-level = 3`
# (speed). The default `release` profile is tuned for embedded binary size,
# which costs a few percent on hot paths — not what we want when measuring
# raw throughput. Run with `cargo run --profile bench-fast --example bench
# --features gateway`.
[profile.bench-fast]
inherits = "release"
opt-level = 3

# Tuned for minimum binary size — `panic = "abort"` drops unwind tables and
# the formatter pulled in by panic-message generation; `lto`/`codegen-units`
# let the linker collapse cross-crate code paths; `opt-level = "z"` favors
# size over speed (typically a few percent slower for ~10–20% smaller text).
# Embedded users SHOULD mirror these in their own binary's Cargo.toml — these
# settings only apply to mcp-edge's own `cargo build --release` (examples/tests).
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
