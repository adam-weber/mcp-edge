[package]
name = "mcp-edge"
version = "0.1.0"
edition = "2021"
description = "Minimal MCP runtime for resource-constrained devices"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []
gateway = ["std"]
# `tls` reserves the `tls://` URL scheme in MultiConnector. The actual rustls
# integration lands in a follow-up PR; today the surface compiles but the
# tls:// arm returns "tls connector not yet implemented".
tls = ["std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }

[lib]
name = "mcp_edge"
path = "src/lib.rs"

[[example]]
name = "sensor"
required-features = ["std"]

[[example]]
name = "stdio"
required-features = ["std"]

[[example]]
name = "gateway"
required-features = ["gateway"]
