[package]
name = "mcp-edge"
version = "0.1.0"
edition = "2021"
description = "Minimal MCP runtime for resource-constrained devices"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []
gateway = ["std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }

[lib]
name = "mcp_edge"
path = "src/lib.rs"

[[example]]
name = "sensor"
required-features = ["std"]

[[example]]
name = "gateway"
required-features = ["gateway"]
