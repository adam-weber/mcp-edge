[package]
name = "mcp-edge"
version = "0.1.0"
edition = "2021"
description = "Minimal MCP runtime for resource-constrained devices"
license = "MIT OR Apache-2.0"

# No dependencies. Zero heap allocation in the core.

[features]
default = ["std"]
std = []

[lib]
name = "mcp_edge"
path = "src/lib.rs"

[[example]]
name = "sensor"
required-features = ["std"]
